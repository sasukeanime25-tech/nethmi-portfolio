<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Black Cat Café — Mega Single File</title>

<!-- ===========================
     Internal CSS (colors, layout, animations)
     =========================== -->
<style>
  :root{
    --black:#0b0b0b;
    --white:#fbfbf7;
    --brown:#6b4f3a;
    --warm-beige:#efe6db;
    --muted:#9a8b80;
    --accent:#2f2f2f;
    --max-width:1100px;
    --radius:12px;
    --ease:cubic-bezier(.2,.9,.2,1);
  }

  /* Reset & base */
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;font-family:Inter, "Segoe UI", Roboto, "Helvetica Neue", Arial, serif;background:linear-gradient(180deg,var(--white),var(--warm-beige));color:var(--black);-webkit-font-smoothing:antialiased}
  img{max-width:100%;height:auto;display:block}
  a{color:inherit}
  .container{width:94%;max-width:var(--max-width);margin:0 auto}

  /* Header */
  header{position:sticky;top:0;z-index:60;background:linear-gradient(180deg, rgba(11,11,11,0.96), rgba(11,11,11,0.88));backdrop-filter: blur(4px);}
  .site-header{display:flex;align-items:center;justify-content:space-between;padding:0.9rem 0}
  .brand{display:flex;align-items:center;gap:0.85rem}
  .logo{
    width:56px;height:56px;border-radius:10px;background:linear-gradient(135deg,var(--brown),#8e6b51);
    display:flex;align-items:center;justify-content:center;color:var(--white);font-weight:800;font-size:18px;box-shadow:0 8px 20px rgba(0,0,0,0.35);
    transform-origin:center;
    animation:logo-breathe 3.6s infinite ease-in-out;
  }
  @keyframes logo-breathe{0%{transform:scale(1)}50%{transform:scale(1.05)}100%{transform:scale(1)}}
  .brand h1{font-size:1.05rem;margin:0;color:var(--white);letter-spacing:.6px}
  .brand .sub{font-size:0.75rem;color:rgba(255,255,255,0.8)}

  /* nav */
  .nav{display:flex;gap:0.9rem;align-items:center}
  .nav a{color:var(--white);text-decoration:none;padding:0.45rem 0.6rem;border-radius:8px;transition:background .22s var(--ease)}
  .nav a:hover{background:rgba(255,255,255,0.06)}
  .nav a.active{box-shadow:inset 0 -3px 0 var(--brown)}
  .hamburger{display:none;background:none;border:0;color:var(--white);font-size:1.4rem;cursor:pointer}

  /* Main layout */
  main{padding:1.4rem 0 3rem}
  .hero{display:grid;grid-template-columns:1fr 460px;gap:1.8rem;align-items:center;padding:2.2rem 0}
  .hero-card{background:var(--white);padding:1.6rem;border-radius:var(--radius);box-shadow:0 18px 40px rgba(0,0,0,0.08);transform:translateY(0);transition:transform .6s var(--ease), box-shadow .4s var(--ease)}
  .hero-card:hover{transform:translateY(-6px);box-shadow:0 28px 60px rgba(0,0,0,0.12)}
  .hero h2{margin:0 0 .5rem 0;font-size:2rem;line-height:1.05}
  .hero p{color:var(--muted);margin-top:0.6rem;line-height:1.5}
  .cta{margin-top:1rem;display:flex;gap:0.6rem;flex-wrap:wrap}
  .btn{background:var(--black);color:var(--white);border:0;padding:0.6rem 1rem;border-radius:8px;cursor:pointer;text-decoration:none;display:inline-block;transition:transform .18s var(--ease)}
  .btn:active{transform:translateY(1px)}
  .btn.secondary{background:transparent;border:1px solid rgba(0,0,0,0.06);color:var(--accent)}
  .card-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin-top:1.1rem}
  .card{background:var(--white);padding:1rem;border-radius:10px;box-shadow:0 6px 18px rgba(0,0,0,0.05);opacity:0;transform:translateY(18px);transition:opacity .6s var(--ease), transform .6s var(--ease)}
  .card.in-view{opacity:1;transform:translateY(0)}
  .section-title{display:flex;align-items:end;justify-content:space-between;margin:1.2rem 0}
  .small{font-size:0.95rem;color:var(--muted)}

  /* hero photo w/ subtle parallax */
  .hero-photo{border-radius:12px;overflow:hidden;height:100%;min-height:320px;box-shadow:0 12px 30px rgba(0,0,0,0.06);position:relative}
  .hero-photo img{width:100%;height:100%;object-fit:cover;transform:translateY(0);transition:transform 0.9s var(--ease)}

  /* menu & lists */
  .menu-list{display:grid;grid-template-columns:repeat(2,1fr);gap:1rem}
  .menu-item{display:flex;justify-content:space-between;padding:0.6rem 0;border-bottom:1px dashed #eee;align-items:center}
  .menu-item img{width:86px;height:64px;object-fit:cover;border-radius:8px;margin-left:0.8rem;opacity:0;transform:translateX(14px);transition:opacity .6s var(--ease), transform .6s var(--ease)}
  .menu-item.in-view img{opacity:1;transform:translateX(0)}

  /* rooms */
  .room-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1rem}
  .room{background:var(--white);padding:1rem;border-radius:10px;box-shadow:0 8px 22px rgba(0,0,0,0.06);display:flex;flex-direction:column;gap:0.6rem}
  .room img{border-radius:8px;height:160px;object-fit:cover}

  /* forms */
  .form-row{display:flex;gap:0.6rem}
  input,textarea,select{width:100%;padding:0.6rem;border-radius:8px;border:1px solid #e6e2dc;font:inherit}
  .vintage-border{border:1px solid rgba(107,79,58,0.12);padding:0.6rem;border-radius:8px}

  /* footer */
  footer{background:var(--black);color:var(--white);padding:1.4rem 0;margin-top:2rem}
  .footer-row{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:0.7rem}
  .socials{display:flex;gap:0.6rem;align-items:center}
  .social-btn{display:inline-flex;align-items:center;gap:0.5rem;background:transparent;border:1px solid rgba(255,255,255,0.06);padding:0.45rem 0.6rem;border-radius:8px;color:var(--white);text-decoration:none;transition:transform .16s var(--ease)}
  .social-btn:hover{transform:translateY(-3px);box-shadow:0 6px 18px rgba(0,0,0,0.18)}

  /* small utility */
  .text-center{text-align:center}
  .muted{color:var(--muted)}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

  /* drawer */
  .nav-drawer{position:fixed;right:0;top:0;height:100%;width:320px;background:var(--white);box-shadow:-12px 0 40px rgba(0,0,0,0.18);transform:translateX(110%);transition:transform .28s var(--ease);padding:1.2rem;z-index:80}
  .nav-drawer.open{transform:translateX(0)}
  .nav-drawer a{display:block;color:var(--black);padding:0.8rem 0;text-decoration:none}

  /* reveal animations */
  .fade-in{opacity:0;transform:translateY(14px);transition:opacity .6s var(--ease), transform .6s var(--ease)}
  .fade-in.in-view{opacity:1;transform:translateY(0)}

  /* responsiveness */
  @media (max-width:1280px){
    .hero{grid-template-columns:1fr 360px}
    .card-grid{grid-template-columns:repeat(2,1fr)}
    .room-grid{grid-template-columns:1fr}
  }
  @media (max-width:680px){
    .site-header{padding:.6rem 0}
    .nav{display:none}
    .hamburger{display:block}
    .hero{grid-template-columns:1fr;gap:1rem}
    .hero-photo{min-height:220px}
    .card-grid{grid-template-columns:1fr}
    .menu-list{grid-template-columns:1fr}
  }
</style>
</head>
<body>

<!-- Header -->
<header>
  <div class="container site-header" role="banner">
    <div class="brand" aria-hidden="false">
      <div class="logo">
      <a href="imgs/123.jpg"><img src="imgs/123.jpg"></a> </div>

        <h1>Black Cat Café</h1>

    <nav class="nav" aria-label="Primary navigation">

</aside>

<main class="container" id="app" role="main" tabindex="-1"></main>

<script type="text/template" id="tpl-home">
  <section class="hero" aria-labelledby="home-title">
    <div class="hero-card fade-in">
      <h2 id="home-title">Slow coffee. Vintage corners. Cozy stays.</h2>
      <p>Black Cat Café blends a soft vintage palette with clean, modern comfort. Drop by for a pour-over, browse second-hand books, or stay upstairs in our renovated colonial rooms.</p>
      <div class="cta">
        <a class="btn" href="#menu" data-link>See Menu</a>
        <a class="btn secondary" href="#stay" data-link>Book a Room</a>
      </div>

      <div class="section-title">
        <h3>Today's special</h3>
        <div class="small">From a local roaster</div>
      </div>

      <div class="card-grid">
        <article class="card"><h4 class="small">Latte — single origin</h4><p class="muted">Smooth, cocoa & spice notes. Served with a warm cookie.</p></article>
        <article class="card"><h4 class="small">Scones & jam</h4><p class="muted">Baked daily using a traditional recipe.</p></article>
        <article class="card"><h4 class="small">Reading nook</h4><p class="muted">Pick a book and drift away — shelves replenished weekly.</p></article>
      </div>
    </div>

    <aside class="hero-photo" aria-hidden="false">
      <img src="https://goodmarket-assets.s3.amazonaws.com/images/ea7097b2-0386-4d8d-ab72-d9cc813505cb.jpg" alt="Cozy corner at Black Cat Cafe">
    </aside>
  </section>

  <section aria-labelledby="why-title">
    <div class="section-title">
      <h3 id="why-title">Why visitors love us</h3>
      <div class="small">Curated. Quiet. Welcoming.</div>
    </div>

    <div class="card-grid">
      <div class="card fade-in"><h4>Vintage, not pretentious</h4><p class="muted">Warm timber, soft linens and brass — restrained and welcoming.</p></div>
      <div class="card fade-in"><h4>Locally sourced</h4><p class="muted">Coffee & pastries from nearby producers where possible.</p></div>
      <div class="card fade-in"><h4>Pet friendly</h4><p class="muted">Well-behaved dogs welcome in the outdoor area.</p></div>
    </div>
  </section>
</script>

    .menu-scroll::-webkit-scrollbar { height: 8px; }

</section>
</script>





<script type="text/template" id="tpl-about">
<section aria-labelledby="about-title" style="font-family:'Inter',sans-serif; padding:2rem 0;">
  <div class="section-title" style="text-align:center; margin-bottom:3rem;">
    <h3 id="about-title" style="font-size:2.8rem; font-weight:700; margin:0 0 0.5rem 0;">Our Story</h3>
    <div style="font-size:1rem; color:#6b4f3a;">A small cafe with a big heart</div>
  </div>

  <style>
    .about-card {
      position: relative;
      width: 90%;
      max-width: 1000px;
      margin: 2rem auto;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 12px 35px rgba(0,0,0,0.1);
      cursor: pointer;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: left;
    }

    .about-card:hover {
      transform: scale(1.02);
      box-shadow: 0 20px 50px rgba(0,0,0,0.2);
    }

    .about-card img {
      width: 100%;
      height: 400px;
      object-fit: cover;
      transition: transform 0.4s ease;
      border-bottom: 1px solid #eee;
    }

    .about-card:hover img {
      transform: scale(1.08);
    }

    .about-card-title {
      position: absolute;
      top: 1rem;

<!-- ===========================
     Internal JavaScript — routing, interactivity, animations
     =========================== -->
<script>
(function(){
  // Elements & templates
  const app = document.getElementById('app');
  const templates = {
    home: document.getElementById('tpl-home').textContent,
    menu: document.getElementById('tpl-menu').textContent,
    about: document.getElementById('tpl-about').textContent,
    stay: document.getElementById('tpl-stay').textContent,
    contact: document.getElementById('tpl-contact').textContent
  };

  // Render route based on location.hash
  function renderRoute(){
    const raw = (location.hash || '#home').replace('#','');
    const route = raw || 'home';
    app.innerHTML = templates[route] || templates.home;
    document.title = 'Black Cat Café — ' + capitalize(route);
    // set active nav
    document.querySelectorAll('[data-link]').forEach(a=>{
      const target = (a.getAttribute('href')||'#home').replace('#','') || 'home';
      a.classList.toggle('active', target === route);
    });
    // focus main for a11y
    app.focus();
    // Attach interactions to newly injected content
    attachHandlers();
    // Trigger scroll reveal
    runScrollReveal();
    // Slight hero parallax tweak
    heroParallax();
  }

  function capitalize(s){ return s.charAt(0).toUpperCase() + s.slice(1) }

  // Attach form handlers and small behaviors
  function attachHandlers(){
    // booking form
    const booking = document.getElementById('booking-form');
    if(booking){
      booking.addEventListener('submit', function(e){
        e.preventDefault();
        const name = booking.querySelector('[name="name"]').value.trim();
        const email = booking.querySelector('[name="email"]').value.trim();
        const checkin = booking.querySelector('[name="checkin"]').value;
        const checkout = booking.querySelector('[name="checkout"]').value;
        if(!name || !email){ alert('Please enter name and email.'); return; }
        if(checkin && checkout && (new Date(checkout) <= new Date(checkin))){ alert('Check-out must be after check-in.'); return; }
        // Demo success
        toast('Booking request sent — demo only. We will contact you.');
        booking.reset();
        location.hash = '#home';
      });
    }

    // contact form
    const contact = document.getElementById('contact-form');
    if(contact){
      contact.addEventListener('submit', function(e){
        e.preventDefault();
        const name = contact.querySelector('[name="name"]').value.trim();
        const email = contact.querySelector('[name="email"]').value.trim();
        if(!name || !email){ alert('Please enter name and email.'); return; }
        toast('Message sent — demo only. Thank you!');
        contact.reset();
        location.hash = '#home';
      });
    }

    // smooth link clicks (within SPA)
    document.querySelectorAll('[data-link]').forEach(a=>{
      a.addEventListener('click', function(e){
        // Let hashchange handle route; drawer links close immediately
        if(a.closest('.nav-drawer')){
          closeDrawer();
        }
      });
    });
  }

  // Tiny toast (non-blocking) notifications
  function toast(message, ms=3000){
    const t = document.createElement('div');
    t.textContent = message;
    t.style.position = 'fixed';
    t.style.bottom = '18px';
    t.style.left = '50%';
    t.style.transform = 'translateX(-50%)';
    t.style.background = 'rgba(11,11,11,0.92)';
    t.style.color = '#fff';
    t.style.padding = '10px 14px';
    t.style.borderRadius = '10px';
    t.style.boxShadow = '0 10px 30px rgba(0,0,0,0.3)';
    t.style.zIndex = 120;
    t.style.opacity = 0;
    t.style.transition = 'opacity .28s ease, transform .28s ease';
    document.body.appendChild(t);
    requestAnimationFrame(()=>{ t.style.opacity = 1; t.style.transform = 'translateX(-50%) translateY(-4px)'; });
    setTimeout(()=>{ t.style.opacity = 0; t.style.transform = 'translateX(-50%) translateY(0)'; setTimeout(()=>t.remove(),320); }, ms);
  }

  // Scroll reveal using IntersectionObserver
  function runScrollReveal(){
    const items = app.querySelectorAll('.fade-in, .card, .menu-item, .menu-item img, .room, .card-grid .card');
    const io = new IntersectionObserver((entries, obs) => {
      entries.forEach(e=>{
        if(e.isIntersecting){
          e.target.classList.add('in-view');
          obs.unobserve(e.target);
        }
      });
    }, {threshold: 0.12});
    items.forEach(it => io.observe(it));
  }

  // Parallax effect for hero image on scroll
  function heroParallax(){
    const heroImg = app.querySelector('.hero-photo img');
    if(!heroImg) return;
    function onScroll(){
      const rect = heroImg.getBoundingClientRect();
      const windowH = window.innerHeight;
      // compute a small transform when element is partly visible
      const visible = Math.max(0, Math.min(1, (windowH - rect.top) / (windowH + rect.height)));
      heroImg.style.transform = `translateY(${(visible - 0.5) * -10}px) scale(${1 + visible*0.01})`;
    }
    onScroll();
    window.addEventListener('scroll', onScroll, {passive:true});
    // cleanup when route changes: we leave handler (lightweight)
  }

  // Mobile nav drawer behavior
  const ham = document.querySelector('.hamburger');
  const drawer = document.querySelector('.nav-drawer');
  if(ham && drawer){
    ham.addEventListener('click', ()=> {
      const isOpen = drawer.classList.toggle('open');
      ham.setAttribute('aria-expanded', String(isOpen));
      drawer.setAttribute('aria-hidden', String(!isOpen));
    });
    drawer.querySelectorAll('a').forEach(a=> a.addEventListener('click', ()=> {
      drawer.classList.remove('open');
      ham.setAttribute('aria-expanded','false'); drawer.setAttribute('aria-hidden','true');
      // allow hashchange to run route
    }));
    document.addEventListener('keydown', (e)=>{ if(e.key==='Escape'){ closeDrawer(); }});
  }

  function closeDrawer(){ drawer.classList.remove('open'); ham.setAttribute('aria-expanded','false'); drawer.setAttribute('aria-hidden','true'); }

  // Router: listen to hash changes
  window.addEventListener('hashchange', renderRoute);
  // Initial render
  renderRoute();

  // Accessibility: skip to main on load
  window.addEventListener('load', ()=>{ const m = document.getElementById('app'); if(m) m.setAttribute('tabindex','-1'); });

})();
</script>
